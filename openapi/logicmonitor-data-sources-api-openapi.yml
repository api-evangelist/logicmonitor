openapi: 3.2.0
info:
  title: Logicmonitor Datasources API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: '1.0'
  description: 'Operations tagged Datasources across 2 of this provider''s published API definitions: logicmonitor-rest-api-v2-swagger.json, logicmonitor-rest-api-v3-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /santaba/rest
tags:
- name: Data Sources
paths:
  /setting/datasources/{dsId}/ographs/{id}:
    get:
      summary: get datasource overview graph by id
      security:
      - LMv1: []
      description: ''
      operationId: getDataSourceOverviewGraphById
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceOverviewGraph'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: dsId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      tags:
      - Data Sources
    servers:
    - url: /santaba/rest
  /setting/datasources/{dsId}/ographs:
    get:
      summary: get datasource overview graph list
      security:
      - LMv1: []
      description: ''
      operationId: getDataSourceOverviewGraphList
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceOverviewGraphPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: dsId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - Data Sources
    servers:
    - url: /santaba/rest
  /setting/datasources/{id}/devices:
    get:
      summary: get devices associated with a datasource
      security:
      - LMv1: []
      description: ''
      operationId: getAssociatedDeviceListByDataSourceId
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDataSourceAssociatedPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - Data Sources
    servers:
    - url: /santaba/rest
  /setting/datasources:
    get:
      summary: get datasource list
      security:
      - LMv1: []
      description: ''
      operationId: getDatasourceList
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourcePaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: format
        required: false
        schema:
          type: string
          default: json
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - Data Sources
    post:
      summary: Add datasource
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> Access Groups: Manage
      description: Adds a new datasource
      operationId: addDatasourceById
      responses:
        '200':
          description: Successfully added new datasource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource_2'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: createGraph
        schema:
          type: boolean
      tags:
      - Data Sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSource_2'
    servers:
    - url: /santaba/rest
  /setting/datasources/{id}:
    get:
      summary: get datasource by id
      security:
      - LMv1: []
      description: ''
      operationId: getDatasourceById
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: format
        required: false
        schema:
          type: string
          default: json
      - in: query
        name: fields
        required: false
        schema:
          type: string
      tags:
      - Data Sources
    delete:
      summary: delete datasource
      security:
      - LMv1: []
      description: ''
      operationId: deleteDatasourceById
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      tags:
      - Data Sources
    patch:
      summary: Update datasource
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> Access Groups: Manage
      description: Updates a datasource by its ID
      operationId: patchDatasourceById
      responses:
        '200':
          description: Successfully updated datasource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource_2'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: reason
        schema:
          type: string
      - in: query
        name: forceUniqueIdentifier
        schema:
          type: boolean
      - in: query
        name: forceRestrictedChangeKey
        schema:
          type: string
      tags:
      - Data Sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSource_2'
    put:
      summary: Update datasource
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> Access Groups: Manage
      description: Updates a datasource by its ID
      operationId: updateDatasourceById
      responses:
        '200':
          description: Successfully updated datasource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource_2'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: reason
        schema:
          type: string
      - in: query
        name: forceUniqueIdentifier
        schema:
          type: boolean
      - in: query
        name: forceRestrictedChangeKey
        schema:
          type: string
      tags:
      - Data Sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSource_2'
    servers:
    - url: /santaba/rest
  /setting/datasources/importxml:
    post:
      summary: import datasource via xml
      security:
      - LMv1: []
      description: ''
      operationId: importDataSource
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Data Sources
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
    servers:
    - url: /santaba/rest
  /setting/datasources/{id}/updatereasons:
    get:
      summary: get update history for a datasource
      security:
      - LMv1: []
      description: ''
      operationId: getUpdateReasonListByDataSourceId
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceUpdateReasonsPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - Data Sources
    servers:
    - url: /santaba/rest
  /setting/datasources/importjson:
    post:
      summary: Import DataSource via json
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules ->  All Installed modules: Manage
        Modules -> Access Groups: Manage
      description: Import a DataSource using json data
      operationId: importDataSourceJson
      responses:
        '200':
          description: Successfully imported the DataSource via Json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource_2'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: handleConflict
        schema:
          type: string
      - in: query
        name: fieldsToPreserve
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - Data Sources
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: LogicModule JSON file
                  format: binary
              required:
              - file
    servers:
    - url: /santaba/rest
components:
  schemas:
    GraphVirtualDataPoint:
      type: object
      properties:
        rpn:
          type: string
        name:
          type: string
    DeviceDataSourceAssociated:
      type: object
      properties:
        instance:
          type: array
          items:
            $ref: '#/components/schemas/DeviceDataSourceAssociatedInstance'
        displayName:
          type: string
        name:
          type: string
        hasMore:
          format: int32
          type: integer
        description:
          type: string
        id:
          format: int32
          type: integer
        hasActiveInstance:
          type: boolean
    DeviceDataSourceAssociatedInstance:
      type: object
      properties:
        name:
          type: string
        alias:
          type: string
        id:
          format: int32
          type: integer
    DeviceDataSourceAssociatedPaginationResponse:
      type: object
      properties:
        total:
          format: int32
          readOnly: true
          type: integer
        searchId:
          readOnly: true
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceDataSourceAssociated'
    DataSourceUpdateReasonsPaginationResponse:
      type: object
      properties:
        total:
          format: int32
          readOnly: true
          type: integer
        searchId:
          readOnly: true
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateReason'
    AutoDiscoveryConfiguration:
      type: object
      required:
      - method
      properties:
        persistentInstance:
          type: boolean
        scheduleInterval:
          format: int32
          type: integer
        deleteInactiveInstance:
          type: boolean
        method:
          $ref: '#/components/schemas/AutoDiscoveryMethod'
        instanceAutoGroupMethod:
          type: string
        instanceAutoGroupMethodParams:
          type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AutoDiscoveryFilter'
        disableInstance:
          type: boolean
        dataSourceName:
          readOnly: true
          type: string
    OverviewGraphDataPoint:
      type: object
      properties:
        aggregateMethod:
          type: string
        dataPointName:
          type: string
        dataPointId:
          format: int32
          type: integer
        consolidateFunc:
          format: int32
          type: integer
    DatasourceOverviewGraphPaginationResponse:
      type: object
      properties:
        total:
          format: int32
          readOnly: true
          type: integer
        searchId:
          readOnly: true
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceOverviewGraph'
    GraphLine:
      type: object
      properties:
        colorName:
          type: string
        dataPointName:
          type: string
        dataPointId:
          format: int32
          type: integer
        legend:
          type: string
        isVirtualDataPoint:
          type: boolean
        type:
          format: int32
          type: integer
    UpdateReason:
      type: object
      properties:
        timeEpoch:
          format: int64
          type: integer
        clientIp:
          type: string
        updateReason:
          type: string
        timeStr:
          type: string
        id:
          format: int32
          type: integer
        userName:
          type: string
    AutoDiscoveryMethod:
      type: object
      required:
      - name
      properties:
        name:
          type: string
      discriminator:
        propertyName: name
    ScriptERIDiscoveryAttributeV2:
      type: object
      required:
      - name
      properties:
        winScript:
          type: string
        groovyScript:
          type: string
        name:
          type: string
        type:
          type: string
        linuxCmdline:
          type: string
        linuxScript:
          type: string
        winCmdline:
          type: string
    DataSource:
      type: object
      required:
      - collectInterval
      - collectMethod
      - collectorAttribute
      - id
      - name
      properties:
        collectorAttribute:
          $ref: '#/components/schemas/CollectorAttribute'
        autoDiscoveryConfig:
          $ref: '#/components/schemas/AutoDiscoveryConfiguration'
        eriDiscoveryConfig:
          $ref: '#/components/schemas/ScriptERIDiscoveryAttributeV2'
        displayName:
          type: string
        description:
          description: The description for the LMModule
          type: string
        appliesTo:
          description: The Applies To for the LMModule
          type: string
        enableAutoDiscovery:
          type: boolean
        technology:
          description: The Technical Notes for the LMModule
          type: string
        version:
          format: int64
          readOnly: true
          type: integer
        tags:
          description: The Tags for the LMModule
          type: string
        auditVersion:
          format: int64
          readOnly: true
          type: integer
        hasMultiInstances:
          readOnly: true
          type: boolean
        collectMethod:
          type: string
        eriDiscoveryInterval:
          format: int32
          type: integer
        enableEriDiscovery:
          type: boolean
        collectInterval:
          format: int32
          type: integer
        name:
          type: string
        dataPoints:
          type: array
          items:
            $ref: '#/components/schemas/DataPoint'
        id:
          format: int32
          description: The ID of the LMModule
          readOnly: true
          type: integer
        group:
          description: The group the LMModule is in
          type: string
    DataPoint:
      type: object
      required:
      - name
      properties:
        alertForNoData:
          format: int32
          type: integer
        maxValue:
          type: string
        dataType:
          format: int32
          type: integer
        postProcessorMethod:
          type: string
        postProcessorParam:
          type: string
        maxDigits:
          format: int32
          type: integer
        rawDataFieldName:
          type: string
        description:
          type: string
        alertClearTransitionInterval:
          format: int32
          type: integer
        userParam3:
          type: string
        userParam2:
          type: string
        type:
          format: int32
          type: integer
        alertExprNote:
          type: string
        dataSourceId:
          format: int32
          readOnly: true
          type: integer
        minValue:
          type: string
        alertBody:
          type: string
        userParam1:
          type: string
        name:
          type: string
        alertSubject:
          type: string
        id:
          format: int32
          readOnly: true
          type: integer
        alertTransitionInterval:
          format: int32
          type: integer
        alertExpr:
          type: string
    ErrorResponse:
      type: object
      properties:
        errorMessage:
          description: The error message
          readOnly: true
          type: string
        errorCode:
          format: int32
          description: The error code
          readOnly: true
          type: integer
        errorDetail:
          description: The error detail
          readOnly: true
          type: object
    CollectorAttribute:
      type: object
      required:
      - name
      properties:
        name:
          type: string
      discriminator:
        propertyName: name
    AutoDiscoveryFilter:
      type: object
      required:
      - attribute
      - operation
      properties:
        comment:
          type: string
        attribute:
          type: string
        operation:
          type: string
        value:
          type: string
    DataSourceOverviewGraph:
      type: object
      properties:
        base1024:
          type: boolean
        timeScale:
          type: string
        maxValue:
          type: object
        displayPrio:
          format: int32
          type: integer
        aggregated:
          type: boolean
        title:
          type: string
        virtualDataPoints:
          type: array
          items:
            $ref: '#/components/schemas/GraphVirtualDataPoint'
        minValue:
          type: object
        name:
          type: string
        width:
          format: int32
          type: integer
        dataPoints:
          type: array
          items:
            $ref: '#/components/schemas/OverviewGraphDataPoint'
        verticalLabel:
          type: string
        id:
          format: int32
          type: integer
        rigid:
          type: boolean
        lines:
          type: array
          items:
            $ref: '#/components/schemas/GraphLine'
        height:
          format: int32
          type: integer
    DatasourcePaginationResponse:
      type: object
      properties:
        total:
          format: int32
          readOnly: true
          type: integer
        searchId:
          readOnly: true
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataSource'
    GraphVirtualDataPoint_2:
      description: The virtual data point list
      type: object
      properties:
        rpn:
          description: The graph virtual data point rpn expression
          type: string
        name:
          description: The graph virtual data point name
          type: string
    DeviceDataSourceAssociated_2:
      type: object
      properties:
        instance:
          description: The instance list associated to the datasource
          type: array
          items:
            $ref: '#/components/schemas/DeviceDataSourceAssociatedInstance_2'
        displayName:
          type: string
        name:
          type: string
        hasMore:
          format: int32
          description: Whether has more instance. 0 no more, 1 has more
          readOnly: true
          type: integer
        description:
          type: string
        id:
          format: int32
          type: integer
        hasActiveInstance:
          description: Whether has active instance.
          readOnly: true
          type: boolean
    AccessGroup:
      description: Module's access groups
      type: object
      required:
      - name
      properties:
        createdBy:
          description: User who created access group
          readOnly: true
          type: string
        name:
          description: The name of the access group
          type: string
          example: LinuxGroup
        tenantId:
          description: Tenancy details
          type: string
        description:
          description: Description about access group
          type: string
        id:
          format: int32
          description: The id of the access group
          readOnly: true
          type: integer
        updatedOn:
          format: int64
          description: Time when access group updated
          readOnly: true
          type: integer
        createdOn:
          format: int64
          description: Time when access group created
          readOnly: true
          type: integer
    DeviceDataSourceAssociatedInstance_2:
      description: The instance list associated to the datasource
      type: object
      properties:
        name:
          description: Instance name
          readOnly: true
          type: string
        alias:
          description: Instance alias
          readOnly: true
          type: string
        id:
          format: int32
          description: Instance id
          readOnly: true
          type: integer
    ScriptERIDiscoveryAttributeV3:
      description: Enable ERI Discovery or not
      type: object
      required:
      - name
      properties:
        winScript:
          description: The Windows script
          type: string
        groovyScript:
          description: The Groovy script
          type: string
        name:
          description: ERI detection name
          type: string
        type:
          description: The script type
          type: string
        linuxCmdline:
          description: The Linux script command line
          type: string
        linuxScript:
          description: The Linux script file
          type: string
        winCmdline:
          description: The Windows script command line
          type: string
    AutoDiscoveryConfiguration_2:
      description: Auto discovery configuration
      type: object
      required:
      - method
      properties:
        persistentInstance:
          description: Persist discovered instance
          type: boolean
        scheduleInterval:
          format: int32
          description: Auto discovery schedule interval in minutes. 0 means host or data source changed. The values can be 0|15|60|1440
          type: integer
        deleteInactiveInstance:
          description: Delete inactive instance
          type: boolean
        method:
          $ref: '#/components/schemas/AutoDiscoveryMethod_2'
        instanceAutoGroupMethod:
          description: Auto group method. The values can be none|netscaler|netscalerservicegroup|regex|esx|ilp
          type: string
        instanceAutoGroupMethodParams:
          description: Auto group method's parameters
          type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AutoDiscoveryFilter_2'
        disableInstance:
          description: Disable discovered instance
          type: boolean
        showDeletedInstanceDays:
          format: int32
          description: show deleted instance days
          type: integer
    OverviewGraphDataPoint_2:
      description: The graph data point list
      type: object
      properties:
        aggregateMethod:
          description: 'The graph line data point aggregate method.

            The values can be average|min|max|sum'
          type: string
        dataPointName:
          description: The graph line data point name
          type: string
        dataPointId:
          format: int32
          description: The graph line data point Id
          type: integer
        consolidateFunc:
          format: int32
          description: "The graph line data point consolidate function.\nThe values can be 1|2|3\nwhere,\n      1=avg, 2=max, 3=min"
          type: integer
        dataSourceDataPointId:
          format: int32
          type: integer
    StatusDisplayName:
      description: The status display name list
      type: object
      required:
      - metricValue
      - operator
      - statusDisplayName
      properties:
        statusDisplayName:
          description: The status display name for the metric value
          type: string
        metricValue:

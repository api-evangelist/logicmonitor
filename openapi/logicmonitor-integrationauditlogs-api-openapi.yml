openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: LogicMonitor is a SaaS-based performance monitoring platform that provides full visibility into complex, hybrid infrastructures, offering granular performance monitoring and actionable data and insights.
  title: LogicMonitor REST Integration Audit Logs API
  version: 3.0.0
servers:
- url: /santaba/rest
tags:
- name: IntegrationAuditLogs
paths:
  /setting/integrations/auditlogs:
    get:
      summary: Get integration audit logs list
      security:
      - LMv1: []
      x-minimum-permissions:
        Settings -> Integrations: View
      description: Retrieves the list of integration audit logs
      operationId: getIntegrationAuditLogs
      responses:
        '200':
          description: Successfully retrieved integration audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationAuditLogPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: format
        schema:
          type: string
      tags:
      - IntegrationAuditLogs
components:
  schemas:
    IntegrationAuditLogPaginationResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationAuditLog'
    IntegrationAuditLog:
      type: object
      properties:
        headers:
          description: HTTP request headers used in alert delivery
          readOnly: true
          type: string
        alertType:
          format: int32
          description: The type of the alert
          readOnly: true
          type: integer
        integrationName:
          description: The name of integration
          readOnly: true
          type: string
        numRetries:
          format: int32
          description: The number of times delivery was retried
          readOnly: true
          type: integer
        integrationAlertStatus:
          description: The Integration Alert Status used for delivery
          readOnly: true
          type: string
        errorMessage:
          description: Error message (if any) from ADC
          readOnly: true
          type: string
        externalTicketId:
          description: The parsed External Ticket ID from alert delivery
          readOnly: true
          type: string
        payloadFormat:
          description: The outbound payload format
          readOnly: true
          type: string
        url:
          description: The URL where the alert was delivered to
          readOnly: true
          type: string
        happenedOnMs:
          format: int64
          description: When the delivery result was saved in LMES
          readOnly: true
          type: integer
        integrationType:
          description: The type of integration
          readOnly: true
          type: string
        alertInstanceId:
          description: The id of the alert instance
          readOnly: true
          type: string
        payload:
          description: The HTTP Request payload
          readOnly: true
          type: string
        httpResponseCode:
          format: int32
          description: The HTTP Response Code received from 3rd party API
          readOnly: true
          type: integer
        id:
          description: The id of audit log record
          readOnly: true
          type: string
        alertId:
          description: The id of the alert
          readOnly: true
          type: string
        httpResponse:
          description: The HTTP Response Body received after alert delivery
          readOnly: true
          type: string
    ErrorResponse:
      type: object
      properties:
        errorMessage:
          description: The error message
          readOnly: true
          type: string
        errorCode:
          format: int32
          description: The error code
          readOnly: true
          type: integer
        errorDetail:
          description: The error detail
          readOnly: true
          type: object
  securitySchemes:
    LMv1:
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: LogicMonitor Support Docs
  url: https://www.logicmonitor.com/support/rest-api-developers-guide/

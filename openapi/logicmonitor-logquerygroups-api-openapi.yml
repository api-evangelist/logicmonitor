openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: LogicMonitor is a SaaS-based performance monitoring platform that provides full visibility into complex, hybrid infrastructures, offering granular performance monitoring and actionable data and insights.
  title: LogicMonitor REST Log Query Groups API
  version: 3.0.0
servers:
- url: /santaba/rest
tags:
- name: LogQueryGroups
paths:
  /log/logquerygroups/{id}/logqueries:
    get:
      summary: Get log queries by group ID
      security:
      - LMv1: []
      x-minimum-permissions:
        Logs -> Log query group: View
      description: Fetch log queries belonging to a log query group
      operationId: getLogQueriesByGroupId
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - LogQueryGroups
  /log/logquerygroups/import:
    post:
      summary: Import log query groups and queries (best-effort)
      security:
      - LMv1: []
      x-minimum-permissions:
        Logs -> Log query group: Manage
      description: Validates the payload, then persists every query that passes validation and returns per-item status with reasons for any unimported entries. HTTP 200 when all imported, 207 on partial success, 500 on fatal error.
      operationId: importLogQueryGroups
      responses:
        '200':
          description: All queries imported successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestLogQueryGroupImportResult'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Fatal error during validation/import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '207':
          description: 'Partial success: some queries imported'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestLogQueryGroupImportResult'
      parameters:
      - in: query
        name: groupType
        schema:
          type: string
      tags:
      - LogQueryGroups
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RestLogQueryGroupValidationRequestItemV4'
  /log/logquerygroups:
    post:
      summary: Create a new log query group
      security:
      - LMv1: []
      x-minimum-permissions:
        Logs -> Log query group: Manage
      description: Add a log query group
      operationId: addLogQueryGroup
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogQueryGroup'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - LogQueryGroups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogQueryGroup'
        required: true
    get:
      summary: Get log query group list
      security:
      - LMv1: []
      x-minimum-permissions:
        Logs -> Log query group: View
      description: Get all log query groups
      operationId: getLogQueryGroupList
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogQueryGroupPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - LogQueryGroups
  /log/logquerygroups/grouptype/{groupType}:
    get:
      summary: Get log query groups by groupType
      security:
      - LMv1: []
      x-minimum-permissions:
        Logs -> Log query group: Manage
      description: Returns log query groups filtered by the provided groupType. If allGroups=true, returns all groups (subject to permissions); otherwise returns groups for the current user.
      operationId: getLogQueryGroupListByGroupType
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogQueryGroupPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: groupType
        required: true
        schema:
          type: string
      - in: query
        name: allGroups
        schema:
          type: boolean
      tags:
      - LogQueryGroups
  /log/logquerygroups/{id}:
    patch:
      summary: Update log query group
      security:
      - LMv1: []
      x-minimum-permissions:
        Logs -> Log query group: Manage
      description: Modify an existing log query group
      operationId: patchLogQueryGroup
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogQueryGroup'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - LogQueryGroups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogQueryGroup'
        required: true
    get:
      summary: Get log query group by ID
      security:
      - LMv1: []
      x-minimum-permissions:
        Logs -> Log query group: Manage
      description: Fetch a log query group by ID
      operationId: getLogQueryGroupById
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogQueryGroup'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - LogQueryGroups
    delete:
      summary: Delete log query group
      security:
      - LMv1: []
      x-minimum-permissions:
        Logs -> Log query group: Manage
      description: Delete log query group by ID
      operationId: deleteLogQueryGroup
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      tags:
      - LogQueryGroups
    put:
      summary: Update log query group
      security:
      - LMv1: []
      x-minimum-permissions:
        Logs -> Log query group: Manage
      description: Modify an existing log query group
      operationId: updateLogQueryGroup
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogQueryGroup'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - LogQueryGroups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogQueryGroup'
        required: true
  /log/logquerygroups/{id}/move:
    post:
      summary: Move log queries to another group
      security:
      - LMv1: []
      x-minimum-permissions:
        Logs -> Log query group: Manage
      description: Move one or more log queries into a different log query group
      operationId: moveLogQueries
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - LogQueryGroups
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
components:
  schemas:
    ArrayNode:
      type: object
    RestLogQueryImportResult:
      description: Import result for one log query.
      type: object
      properties:
        duration:
          description: Saved query time range.
          type: string
          example: 5min
        partitions:
          description: Optional log partitions selected for the query.
          type: array
          items:
            description: Optional log partitions selected for the query.
            type: string
            example: '["partition1"]'
          example:
          - partition1
        reason:
          description: Validation or import status reason for the query.
          type: string
          example: Existing query
        query:
          description: Log query expression.
          type: string
          example: error
        isValid:
          type: boolean
        label:
          description: Saved query label.
          type: string
          example: AWS error logs
        viewConfig:
          description: Optional saved view configuration for the query.
          readOnly: false
          $ref: '#/components/schemas/View_Config'
    RestResponseMetaBlock:
      type: object
      properties:
        filteredCount:
          format: int64
          type: integer
        isTotalCountExhaustive:
          type: boolean
        fromPagingResponseInfo:
          $ref: '#/components/schemas/RestResponseMetaBlock'
        fromSortInfo:
          $ref: '#/components/schemas/RestResponseMetaBlock'
        perPageCount:
          format: int32
          type: integer
        sort:
          type: string
        totalCount:
          format: int64
          type: integer
        pageOffsetCount:
          format: int32
          type: integer
    RestLogQueryValidationRequestItemV4:
      type: object
      properties:
        duration:
          type: string
        partitions:
          type: array
          items:
            type: string
        query:
          type: string
        label:
          type: string
        viewConfig:
          $ref: '#/components/schemas/View_Config'
        version:
          type: string
    LogQueryGroup:
      type: object
      required:
      - name
      properties:
        groupType:
          type: string
          enum:
          - PRIVATE
          - SHARED
          - PUBLIC
        userPermission:
          description: Effective user permission for this group
          type: string
        logQuery:
          description: List of log queries in this group
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/Log_Query'
        name:
          description: The name of the log query group
          type: string
        description:
          description: Description of the log query group
          type: string
        id:
          format: int32
          description: The ID of the log query group
          readOnly: true
          type: integer
        ownerId:
          format: int32
          description: Owner of the log query group
          type: integer
        parentId:
          format: int32
          description: Parent group ID if nested
          type: integer
    ObjectNode:
      type: object
    RestLogQueryGroupImportResult:
      description: Import result for one log query group.
      type: object
      properties:
        reason:
          description: Validation or import status reason for the group.
          type: string
          example: existing
        logQuery:
          description: Per-query import results for this group.
          type: array
          items:
            $ref: '#/components/schemas/RestLogQueryImportResult'
        isValid:
          type: boolean
        name:
          description: Name of the target log query group.
          type: string
          example: Ungrouped
        description:
          description: Description of the target log query group.
          type: string
          example: Ungrouped folder
    RestResponse:
      type: object
      properties:
        diagnostics:
          $ref: '#/components/schemas/ArrayNode'
        suppressedWarnings:
          $ref: '#/components/schemas/ArrayNode'
        preserveInsertionOrder:
          type: boolean
        data:
          $ref: '#/components/schemas/ObjectNode'
        suppressedErrors:
          $ref: '#/components/schemas/ArrayNode'
        successes:
          $ref: '#/components/schemas/ArrayNode'
        meta:
          $ref: '#/components/schemas/RestResponseMetaBlock'
        warnings:

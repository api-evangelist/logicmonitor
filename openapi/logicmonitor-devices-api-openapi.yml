        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: end
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: netflowFilter
        required: false
        schema:
          type: string
      - in: query
        name: addFromWizard
        required: false
        schema:
          type: boolean
          default: false
      tags:
      - Devices
      requestBody:

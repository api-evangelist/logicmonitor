openapi: 3.2.0
info:
  title: Logicmonitor Thresholds API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: '1.0'
  description: 'Operations tagged Thresholds across 2 of this provider''s published API definitions: logicmonitor-rest-api-v2-swagger.json, logicmonitor-rest-api-v3-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /santaba/rest
tags:
- name: Thresholds
paths:
  /device/devices/{deviceId}/devicedatasources/{hdsId}/instances/{instanceId}/alertsettings:
    get:
      summary: get a list of alert settings for a device datasource instance
      security:
      - LMv1: []
      description: ''
      operationId: getDeviceDatasourceInstanceAlertSettingListOfDSI
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDataSourceInstanceAlertSettingPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: path
        name: hdsId
        description: Device-DataSource ID
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: path
        name: instanceId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      tags:
      - Thresholds
    servers:
    - url: /santaba/rest
  /device/groups/{deviceGroupId}/clusterAlertConf:
    post:
      summary: Add cluster alert configuration
      security:
      - LMv1: []
      description: ''
      operationId: addDeviceGroupClusterAlertConf
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceClusterAlertConfig'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: deviceGroupId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      tags:
      - Thresholds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceClusterAlertConfig'
        required: true
    get:
      summary: get a list of cluster alert configurations for a device group
      security:
      - LMv1: []
      description: ''
      operationId: getDeviceGroupClusterAlertConfList
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceClusterAlertConfigPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: deviceGroupId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - Thresholds
    servers:
    - url: /santaba/rest
  /device/groups/{deviceGroupId}/datasources/{dsId}/alertsettings:
    patch:
      summary: update device group datasource alert setting
      security:
      - LMv1: []
      description: ''
      operationId: patchDeviceGroupDatasourceAlertSetting
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceGroupDataSourceAlertConfig'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: deviceGroupId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: path
        name: dsId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      tags:
      - Thresholds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceGroupDataSourceAlertConfig'
        required: true
    get:
      summary: get device group datasource alert setting
      security:
      - LMv1: []
      description: ''
      operationId: getDeviceGroupDatasourceAlertSetting
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceGroupDataSourceAlertConfig'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: deviceGroupId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: path
        name: dsId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: fields
        required: false
        schema:
          type: string
      tags:
      - Thresholds
    put:
      summary: update device group datasource alert setting
      security:
      - LMv1: []
      description: ''
      operationId: updateDeviceGroupDatasourceAlertSetting
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceGroupDataSourceAlertConfig'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: deviceGroupId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: path
        name: dsId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      tags:
      - Thresholds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceGroupDataSourceAlertConfig'
        required: true
    servers:
    - url: /santaba/rest

    put:
      summary: update device instance alert setting
      security:
      - LMv1: []
      description: ''
      operationId: updateDeviceDatasourceInstanceAlertSettingById
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDataSourceInstanceAlertSetting'
        default:

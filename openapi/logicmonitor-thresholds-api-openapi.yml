      summary: Delete cluster alert configuration
      security:
      - LMv1: []
      description: ''
      operationId: deleteDeviceGroupClusterAlertConfById
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error

              $ref: '#/components/schemas/DeviceClusterAlertConfig'
        required: true
    get:
      summary: Get cluster alert configuration by id
      security:
      - LMv1: []
      description: ''
      operationId: getDeviceGroupClusterAlertConfById
      responses:
        '200':
          description: successful operation

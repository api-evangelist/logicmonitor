              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: path
        name: hdsId
        description: Device-DataSource ID
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: path
        name: instanceId
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: path
        name: id
        required: true

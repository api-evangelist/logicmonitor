components:
  schemas:
    DeviceDataSourceInstanceAlertSettingPaginationResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceDataSourceInstanceAlertSetting'
    DeviceGroupAlertThresholdInfo:
      type: object
      properties:
        userPermission:
          readOnly: true
          type: string
        groupId:
          format: int32
          readOnly: true
          type: integer
        alertEnabled:
          readOnly: true
          type: boolean
        groupFullPath:
          readOnly: true
          type: string
        alertExpr:
          readOnly: true
          type: string
    DeviceClusterAlertConfig:
      type: object
      properties:
        countBy:
          description: host | instance - Whether the cluster alert is based on an alert count across devices or instances
          type: string
          example: host
        dataPointName:
          description: The name of the dataPoint you want to base the cluster alert on
          readOnly: true
          type: string
          example: InMbps
        dataSourceId:
          format: int32
          description: The id of the dataSource you want to base the cluster alert on
          type: integer
          example: 396.0
        dataPointId:
          format: int32
          description: The id of the dataPoint you want to base the cluster alert on
          readOnly: true
          type: integer
          example: 2016.0
        minAlertLevel:
          format: int32
          description: 'The alert level that must be present for the devices or instances to trigger the cluster alert. Acceptable values are: 2, 3, 4'
          type: integer
          example: 4.0
        dataSourceDisplayName:
          description: The display name of the dataSource you want to base the cluster alert on
          type: string
          example: Interfaces (64 bit)-
        disableAlerting:
          description: Whether or not alerting will be disabled
          type: boolean
          example: false
        id:
          format: int32
          description: The id of the cluster alert configuration
          readOnly: true
          type: integer
        suppressIndAlert:
          description: Whether or not alerting will be suppressed for individual alerts, the default value is true
          type: boolean
          example: 'true'
        thresholdType:
          description: 'whether the alert expression should be evaluated as a total number of devices or instances (absolute) or as a percentage of devices or instances (percentage). Acceptable values are: absolute, percentage'
          type: string
          example: absolute
        dataPointDescription:
          description: The description of the dataPoint you want to base the cluster alert on
          readOnly: true
          type: string
          example: 'Inbound throughput, in megabits per second.


            Best choice for reports, etc.'
        alertExpr:
          description: The expression that indicates the number of objects (devices or instances) that need to be in alert to trigger the cluster alert. E.g. > 5
          type: string
          example: '>=2'
    DeviceGroupDataSourceDataPointConfig:
      type: object
      required:
      - alertExpr
      - dataPointId
      - dataPointName
      properties:
        globalAlertExpr:
          readOnly: true
          type: string
        dataPointName:
          type: string
        dataPointId:
          format: int32
          type: integer
        disableAlerting:
          type: boolean
        alertExprNote:
          type: string
        alertExpr:
          type: string
        dataPointDescription:
          readOnly: true
          type: string
    DeviceClusterAlertConfigPaginationResponse:
      type: object
      properties:
        total:
          format: int32
          readOnly: true
          type: integer
        searchId:
          readOnly: true
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceClusterAlertConfig'
    ErrorResponse:
      type: object
      properties:
        errorMessage:
          description: The error message
          readOnly: true
          type: string
        errorCode:
          format: int32
          description: The error code
          readOnly: true
          type: integer
        errorDetail:
          description: The error detail
          readOnly: true
          type: object
    DeviceDataSourceInstanceAlertSetting:
      type: object
      properties:
        globalAlertExpr:
          description: The global alert expression for this datapoint
          readOnly: true
          type: string
        alertClearInterval:
          format: int32
          description: The interval of alert clear transition
          readOnly: true
          type: integer
        disableAlerting:
          description: Whether or not alerting will be disabled for the datapoint
          type: boolean
          example: true
        alertExprNote:
          description: The note associated with the current alert threshold settings
          type: string
          example: Router 1 Ping Check
        dataPointDescription:
          description: The description of the datapoint the alert settings apply to
          readOnly: true
          type: string
        dataSourceInstanceId:
          format: int32
          description: The id of the DataSource instance alert settings apply to
          readOnly: true
          type: integer
        disableDpAlertHostGroups:
          description: The group full path lists who disable alert for this datapoint on devicegroup level
          readOnly: true
          type: string
        dataPointName:
          description: The name of the datapoint the alert settings apply to
          readOnly: true
          type: string
        dataPointId:
          format: int32
          description: The id of the Datapoint alert settings apply to
          readOnly: true
          type: integer
        deviceGroupId:
          format: int32
          description: The ID of the device group
          readOnly: true
          type: integer
        parentDeviceGroupAlertExprList:
          description: Device group alert expression list base on the priority. The first is the highest priority and effected on this instance
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/DeviceGroupAlertThresholdInfo'
        alertingDisabledOn:
          description: The datapoint is effected alert disabled by which group
          readOnly: true
          type: string
        id:
          format: int32
          description: The id of this alert setting
          readOnly: true
          type: integer
        dataSourceInstanceAlias:
          description: The alias (name) of the DataSource instance the alert settings apply to
          readOnly: true
          type: string
        deviceGroupFullPath:
          description: The full path of the device group
          readOnly: true
          type: string
        alertExpr:
          description: The thresholds that should be associated with the datapoint. Note that you need to have a space between the operator and each threshold (e.g. > 1 2 3)
          type: string
          example: '>= 70 90 95'
        alertTransitionInterval:
          format: int32
          description: The interval of alert transition
          readOnly: true
          type: integer
    DeviceGroupDataSourceAlertConfig:
      type: object
      properties:
        datasourceType:
          readOnly: true
          type: string
        dpConfig:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/DeviceGroupDataSourceDataPointConfig'
    InstanceGroupAlertThresholdInfo:
      description: Instance group alert expression list base on the priority. The first is the highest priority and effected on this instance
      readOnly: true
      type: object
      properties:
        enableAnomalyAlertGeneration:
          description: enable anomaly alert generation
          readOnly: true
          type: string
        alertForNoData:
          format: int32
          description: The triggered alert level if we cannot collect data for this datapoint. The values can be 1-4 ( 1:no alert, 2:warn alert, 3:error alert, 4:critical alert)
          readOnly: true
          type: integer
          example: 1
        enableAnomalyAlertSuppression:
          description: enable anomaly alert suppression
          readOnly: true
          type: string
        groupId:
          format: int32
          readOnly: true
          type: integer
        alertClearTransitionInterval:
          format: int32
          description: The count that the alert must exist for this many poll cycles before the alert will be cleared
          readOnly: true
          type: integer
          example: 0
        alertEnabled:
          readOnly: true
          type: boolean
        alertExpr:
          readOnly: true
          type: string
        alertTransitionInterval:
          format: int32
          description: The count that the alert must exist for this many poll cycles before it will be triggered
          readOnly: true
          type: integer
          example: 0
    DeviceGroupAlertThresholdInfo_2:
      description: Device group alert expression list base on the priority. The first is the highest priority and effected on this instance
      readOnly: true
      type: object
      properties:
        enableAnomalyAlertGeneration:
          description: enable anomaly alert generation
          readOnly: true
          type: string
        alertForNoData:
          format: int32
          description: The triggered alert level if we cannot collect data for this datapoint. The values can be 1-4 (1:no alert, 2:warn alert, 3:error alert, 4:critical alert)
          type: integer
          example: 1
        userPermission:
          readOnly: true
          type: string
        enableAnomalyAlertSuppression:
          description: enable anomaly alert suppression
          readOnly: true
          type: string
        groupId:
          format: int32
          readOnly: true
          type: integer
        alertClearTransitionInterval:
          format: int32
          description: The count that the alert must exist for this many poll cycles before the alert will be cleared
          type: integer
          example: 0
        alertEnabled:
          readOnly: true
          type: boolean
        groupFullPath:
          readOnly: true
          type: string
        alertExpr:
          readOnly: true
          type: string
        alertTransitionInterval:
          format: int32
          description: The count that the alert must exist for this many poll cycles before it will be triggered
          type: integer
          example: 0
    DeviceClusterAlertConfig_2:
      type: object
      properties:
        minAlertLevel:
          format: int32
          description: 'The alert level that must be present for the devices or instances to trigger the cluster alert. Acceptable values are: 2, 3, 4'
          type: integer
          example: 4
        dataSourceDisplayName:
          description: The display name of the dataSource you want to base the cluster alert on
          type: string
          example: Interfaces (64 bit)-
        disableAlerting:
          description: Whether or not alerting will be disabled
          type: boolean
          example: false
        dataPointDescription:
          description: The description of the dataPoint you want to base the cluster alert on
          readOnly: true
          type: string
          example: 'Inbound throughput, in megabits per second.


            Best choice for reports, etc.'
        countBy:
          description: host | instance - Whether the cluster alert is based on an alert count across devices or instances
          type: string
          example: host
        dataPointName:
          description: The name of the dataPoint you want to base the cluster alert on
          readOnly: true
          type: string
          example: InMbps
        dataSourceId:
          format: int32
          description: The id of the dataSource you want to base the cluster alert on
          type: integer
          example: 396
        dataPointId:
          format: int32
          description: The id of the dataPoint you want to base the cluster alert on
          readOnly: true
          type: integer
          example: 2016
        deviceGroupId:
          format: int32
          description: The id of the device group this cluster alert configuration belongs to
          readOnly: true
          type: integer
        id:
          format: int32
          description: The id of the cluster alert configuration
          readOnly: true
          type: integer
        suppressIndAlert:
          description: Whether or not alerting will be suppressed for individual alerts, the default value is true
          type: boolean
          example: 'true'
        thresholdType:
          description: 'whether the alert expression should be evaluated as a total number of devices or instances (absolute) or as a percentage of devices or instances (percentage). Acceptable values are: absolute, percentage'
          type: string
          example: absolute
        alertExpr:
          description: The expression that indicates the number of objects (devices or instances) that need to be in alert to trigger the cluster alert. E.g. > 5
          type: string
          example: '>=2'
    DeviceGroupDataSourceDataPointConfig_2:
      type: object
      required:
      - alertExpr
      - dataPointId
      - dataPointName
      properties:
        globalAlertExpr:
          readOnly: true
          type: string
        alertForNoData:
          format: int32
          description: The triggered alert level if we cannot collect data for this datapoint. The values can be 1-4 (1:no alert, 2:warn alert, 3:error alert, 4:critical alert)
          type: integer
          example: 1
        disableAlerting:
          type: boolean
        alertClearTransitionInterval:
          format: int32

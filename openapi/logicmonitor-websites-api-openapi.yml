openapi: 3.2.0
info:
  title: Logicmonitor Websites API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: '1.0'
  description: 'Operations tagged Websites across 2 of this provider''s published API definitions: logicmonitor-rest-api-v2-swagger.json, logicmonitor-rest-api-v3-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /santaba/rest
tags:
- name: Websites
paths:
  /website/websites/{id}/historysdts:
    get:
      summary: get SDT history for the website
      security:
      - LMv1: []
      description: ''
      operationId: getSDTHistoryByWebsiteId
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteSDTHistoryPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - Websites
    servers:
    - url: /santaba/rest
  /website/websites/{id}:
    patch:
      summary: update website
      security:
      - LMv1: []
      description: ''
      operationId: patchWebsiteById
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Website'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: opType
        required: false
        schema:
          type: string
          default: refresh
      tags:
      - Websites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Website'
        required: true
    get:
      summary: get website by id
      security:
      - LMv1: []
      description: ''
      operationId: getWebsiteById
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Website'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: format
        required: false
        schema:
          type: string
          default: json
      tags:
      - Websites
    delete:
      summary: delete website
      security:
      - LMv1: []
      description: ''
      operationId: deleteWebsiteById
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      tags:
      - Websites
    put:
      summary: update website
      security:
      - LMv1: []
      description: ''
      operationId: updateWebsiteById
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Website'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: opType
        required: false
        schema:
          type: string
          default: refresh
      tags:
      - Websites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Website'
        required: true
    servers:
    - url: /santaba/rest
  /website/websites/{id}/properties:
    get:
      summary: get a list of properties for a website
      security:
      - LMv1: []
      description: ''
      operationId: getWebsitePropertyListByWebsiteId
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - Websites
    servers:
    - url: /santaba/rest
  /website/websites/{id}/alerts:
    get:
      summary: get alerts for a website
      security:
      - LMv1: []
      description: ''
      operationId: getWebsiteAlertListByWebsiteId
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: needMessage
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: customColumns
        required: false
        schema:
          type: string
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - Websites
    servers:
    - url: /santaba/rest
  /website/websites:
    post:
      summary: add website
      security:
      - LMv1: []
      description: ''
      operationId: addWebsite
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Website'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Websites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Website'
        required: true
    get:
      summary: get website list
      security:
      - LMv1: []
      description: ''
      operationId: getWebsiteList
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsitePaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: collectorIds
        required: false
        schema:
          type: string
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - Websites
    servers:
    - url: /santaba/rest
  /website/websites/{id}/sdts:
    get:
      summary: get a list of SDTs for a website
      security:
      - LMv1: []
      description: ''
      operationId: getWebsiteSDTListByWebsiteId
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SDTPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - Websites
    servers:
    - url: /santaba/rest
  /website/websites/{id}/graphs/{graphName}/data:
    get:
      summary: get website data by graph name
      security:
      - LMv1: []
      description: ''
      operationId: getWebsiteDataByGraphName
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphPlot'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          pattern: \d+
      - in: query
        name: start
        required: false
        schema:
          type: integer
          format: int64
          default: 0.0
      - in: query
        name: end
        required: false
        schema:
          type: integer
          format: int64
          default: 0.0
      - in: path
        name: graphName
        required: true
        schema:
          type: string
          pattern: .+
      - in: query
        name: format
        required: false
        schema:
          type: string
      tags:
      - Websites
    servers:
    - url: /santaba/rest
  /website/smcheckpoints:
    get:
      summary: get website checkpoint list
      security:
      - LMv1: []
      description: ''
      operationId: getSiteMonitorCheckPointList
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMonitorCheckPointPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50.0
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0.0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - Websites
    servers:
    - url: /santaba/rest
  /website/websites/{srvId}/checkpoints/{checkId}/data:
    get:
      summary: get data for a website checkpoint
      security:
      - LMv1: []
      x-minimum-permissions:
        Websites: View
        Users -> Permissions: View permissions on Services and Website page
      operationId: getWebsiteCheckpointDataById
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteCheckpointRawData'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: srvId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: checkId
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: period
        schema:
          type: number
          format: double
      - in: query
        name: start
        schema:
          type: integer
          format: int64
      - in: query
        name: end
        schema:
          type: integer
          format: int64
      - in: query
        name: datapoints
        schema:
          type: string
      - in: query
        name: format
        schema:
          type: string
      - in: query
        name: aggregate
        description: the aggregate option
        schema:
          type: string
      tags:
      - Websites
    servers:
    - url: /santaba/rest
components:
  schemas:
    AlertPaginationResponse:
      type: object
      properties:
        total:
          format: int32
          readOnly: true
          type: integer
        searchId:
          readOnly: true
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
    Authentication:
      type: object
      required:
      - password
      - type
      - userName
      properties:
        password:
          type: string
        type:
          type: string
          example: basic
        userName:
          type: string
      discriminator:
        propertyName: type
    SDT:
      type: object
      required:
      - type
      properties:
        endDateTimeOnLocal:
          description: The date, time and time zone that the SDT will end at
          readOnly: true
          type: string
        timezone:
          description: The specific timezone for SDT
          type: string
          example: America/Los_Angeles
        sdtType:
          type: string
          example: oneTime
        monthDay:
          format: int32
          description: 1 | 2....| 31 The day of the month that the SDT will be active for a monthly SDT
          type: integer
          example: 7.0
        weekOfMonth:
          description: The weel of the month that the SDT will be active for a monthly SDT
          type: string
          example: '1'
        admin:
          description: The name of the user that created the SDT
          readOnly: true
          type: string
        endDateTime:
          format: int64
          description: The epoch time, in milliseconds, that the SDT will end
          type: integer
          example: 1534554000000.0
        type:
          description: 'The type resource that this SDT is for: ServiceSDT | CollectorSDT | DeviceDataSourceInstanceSDT | DeviceBatchJobSDT | DeviceClusterAlertDefSDT | DeviceDataSourceInstanceGroupSDT | DeviceDataSourceSDT | DeviceEventSourceSDT | DeviceGroupSDT | DeviceSDT | WebsiteCheckpointSDT | WebsiteGroupSDT | WebsiteSDT'
          type: string
          example: DeviceGroupSDT
        isEffective:
          description: 'true: the SDT is currently actice

            false: the SDT is currently inactive'
          readOnly: true
          type: boolean
        minute:
          format: int32
          description: 1 | 2....| 60 The minute of the hour that the SDT should begin for a repeating SDT
          type: integer
          example: 6.0
        duration:
          format: int32
          description: The duration of the SDT in minutes
          type: integer
          example: 138.0
        endHour:
          format: int32
          description: 1 | 2....| 24 The hour that the SDT ends for a repeating SDT
          type: integer
          example: 5.0
        startDateTime:
          format: int64
          description: The epoch time, in milliseconds, that the SDT will start
          type: integer
          example: 1534460400000.0
        hour:
          format: int32
          description: 1 | 2....| 24 The hour that the SDT will start for a repeating SDT (daily, weekly, or monthly)
          type: integer
          example: 3.0
        startDateTimeOnLocal:
          description: The date, time and time zone that the SDT will end at
          readOnly: true
          type: string
        weekDay:
          type: string
          example: Sunday
        comment:
          description: The notes associated with the SDT
          type: string
          example: Emergency prod deployment
        id:
          description: 'The Id of the SDT. This value will be in the following format "XX_##" where XX will refer to the type of SDT and ## will refer to the number of SDTs of that type'
          readOnly: true
          type: string
        endMinute:
          format: int32
          description: 1 | 2....| 60 The minute of the hour that the SDT ends for a repeating SDT
          type: integer
          example: 18.0
      discriminator:
        propertyName: type
    SiteMonitorCheckPointPaginationResponse:
      type: object
      properties:
        total:
          format: int32
          readOnly: true
          type: integer
        searchId:
          readOnly: true
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteMonitorCheckpoint'
    WebCheckStep:
      type: object
      properties:
        schema:
          type: string
        respType:
          type: string
        HTTPHeaders:
          type: string
        auth:
          $ref: '#/components/schemas/Authentication'
        matchType:
          type: string
          example: plain
        description:
          type: string
        type:
          readOnly: true
          type: string
          example: config
        timeout:
          format: int32
          type: integer
        useDefaultRoot:
          type: boolean
          example: 'true'
        path:
          type: string
        HTTPMethod:
          type: string
          example: GET
        enable:
          type: boolean
        HTTPVersion:
          type: string
          example: '1.1'
        keyword:
          type: string
        respScript:
          type: string
        label:
          type: string
        url:
          type: string
          example: /
        invertMatch:
          type: boolean
          example: false
        reqScript:
          type: string
        HTTPBody:
          type: string
        followRedirection:
          type: boolean
          example: 'true'
        postDataEditType:
          type: string
          example: raw
        name:
          type: string
        requireAuth:
          type: boolean
          example: false
        reqType:
          type: string
        fullpageLoad:
          type: boolean
          example: false
        statusCode:
          type: string
    WebsitePaginationResponse:
      type: object
      properties:
        total:
          format: int32
          readOnly: true
          type: integer
        searchId:
          readOnly: true
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Website'
    Alert:
      type: object
      properties:
        resourceId:
          format: int32
          description: The device specific LogicModule Id
          readOnly: true
          type: integer
        instanceName:
          description: The name of the instance in alert
          readOnly: true
          type: string
        monitorObjectId:
          format: int32
          description: The id of the object that the alert is associated with
          readOnly: true
          type: integer
        endEpoch:
          format: int64
          description: The time (in epoch format) that the alert ended
          readOnly: true
          type: integer
        rule:
          description: The rule the alert matches
          readOnly: true
          type: string
        threshold:
          description: The threshold associated with the object in alert
          readOnly: true
          type: string
        type:
          description: The type of alert
          readOnly: true
          type: string
        startEpoch:
          format: int64
          description: The time (in epoch format) that the alert started
          readOnly: true
          type: integer
        enableAnomalyAlertGeneration:
          type: string
        internalId:
          description: The internal id for the alert
          readOnly: true
          type: string
        ackComment:
          description: The comment submitted with the acknowledgement
          readOnly: true
          type: string
        monitorObjectName:
          description: The name of the object that the alert is associated with
          readOnly: true
          type: string
        dataPointName:
          description: The name of the datapoint in alert
          readOnly: true
          type: string
        instanceId:
          format: int32
          description: The id of the instance in alert
          readOnly: true
          type: integer
        dataPointId:
          format: int32
          description: The id of the datapoint in alert
          readOnly: true
          type: integer
        nextRecipient:
          format: int32
          description: The next recipient in the escalation chain for this alert
          readOnly: true
          type: integer
        id:
          description: The alert id
          readOnly: true
          type: string
        detailMessage:
          description: The alert message, if needMessage=true is included in the query parameters
          readOnly: true
          type: object
        ruleId:
          format: int32
          description: The id of the rule the alert matches
          readOnly: true
          type: integer
        alertValue:
          description: The value that triggered the alert
          readOnly: true
          type: string
        ackedBy:
          description: The user that acknowledged the alert
          readOnly: true
          type: string
        severity:
          format: int32
          description: The alert severity, where 2=warning, 3=error and 4=critical
          readOnly: true
          type: integer
        sdted:
          description: Whether or not the alert was triggered during an SDT
          readOnly: true
          type: boolean
        ackedEpoch:
          format: int64
          description: The time (in epoch format) that the alert was acknowledged
          readOnly: true
          type: integer
        chain:
          description: The escalation chain the alert was routed to
          readOnly: true
          type: string
        SDT:
          description: The active SDT, if one exists
          readOnly: true
          type: object
        subChainId:
          format: int32
          description: The id of the sub time based chain
          readOnly: true
          type: integer
        enableAnomalyAlertSuppression:
          type: string
        receivedList:
          description: The recipients that have received the alert
          readOnly: true
          type: string
        serviceMembers:
          description: Service member name and value
          readOnly: true
          type: object
        monitorObjectType:
          readOnly: true
          type: string
        customColumns:
          description: 'The property or token values that should display with the alert details. Note that if referencing tokens, you''ll need to URL encode the # symbol.'
          readOnly: true
          type: object
        acked:
          description: Whether or not the alert has been acknowledged
          readOnly: true
          type: boolean
        resourceTemplateType:
          description: The type of the logicmodule in alert
          readOnly: true
          type: string
        clearValue:
          description: The value that cleared the alert
          readOnly: true
          type: string
        instanceDescription:
          description: The description of the instance in alert
          readOnly: true
          type: string
        monitorObjectGroups:
          description: Information about the groups the object is a member of
          readOnly: true
          type: object
        chainId:
          format: int32
          description: The id of the escalation chain the alert was routed to
          readOnly: true
          type: integer
        resourceTemplateId:
          format: int32
          description: The id of the datasource in alert
          readOnly: true
          type: integer
        cleared:
          description: Whether or not the alert has cleared
          readOnly: true
          type: boolean
        resourceTemplateName:
          description: The name of the datasource in alert
          readOnly: true
          type: string
    InheritanceProp:
      type: object
      properties:
        fullpath:
          readOnly: true
          type: string
        id:
          format: int32
          readOnly: true
          type: integer
        type:
          readOnly: true
          type: string
        value:
          readOnly: true
          type: string
    GraphPlot:
      allOf:
      - $ref: '#/components/schemas/WidgetData'
      - type: object
        properties:
          missinglines:
            readOnly: true
            type: array
            items:
              type: string
          timeScale:
            readOnly: true
            type: string
          instances:
            uniqueItems: true
            readOnly: true
            type: array
            items:
              format: int32
              type: integer
          timestamps:
            readOnly: true
            type: array
            items:
              format: int64
              type: integer
          minValue:
            readOnly: true
            type: object
          startTime:
            format: int64
            readOnly: true
            type: integer
          id:
            format: int32
            readOnly: true
            type: integer
          rigid:
            readOnly: true
            type: boolean
          lines:
            readOnly: true
            type: array
            items:
              $ref: '#/components/schemas/GraphPlotLine'
          height:
            format: int32
            readOnly: true
            type: integer
          endTZOffset:
            format: int32

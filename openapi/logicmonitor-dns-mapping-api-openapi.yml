openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: LogicMonitor is a SaaS-based performance monitoring platform that provides full visibility into complex, hybrid infrastructures, offering granular performance monitoring and actionable data and insights.
  title: LogicMonitor REST DNS Mapping API
  version: 3.0.0
servers:
- url: /santaba/rest
tags:
- name: DNS Mapping
paths:
  /setting/dnsmappings:
    post:
      summary: Add DNS mapping
      security:
      - LMv1: []
      x-minimum-permissions:
        Settings -> Collectors: Manage
      description: Add a new DNS mapping
      operationId: addDNSMapping
      responses:
        '200':
          description: Successfully added the DNS mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestDNSMappingV3'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - DNS Mapping
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestDNSMappingV3'
components:
  schemas:
    RestDNSMappingV3:
      type: object
      properties:
        endIp:
          type: string
        startIp:
          type: string
        collectorDescription:
          type: string
        dns:
          type: string
        collectorId:
          format: int32
          type: integer
        id:
          format: int32
          type: integer
    ErrorResponse:
      type: object
      properties:
        errorMessage:
          description: The error message
          readOnly: true
          type: string
        errorCode:
          format: int32
          description: The error code
          readOnly: true
          type: integer
        errorDetail:
          description: The error detail
          readOnly: true
          type: object
  securitySchemes:
    LMv1:
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: LogicMonitor Support Docs
  url: https://www.logicmonitor.com/support/rest-api-developers-guide/

openapi: 3.2.0
info:
  title: Logicmonitor Config Sources API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: '1.0'
  description: 'Operations tagged ConfigSources across 2 of this provider''s published API definitions: logicmonitor-rest-api-v2-swagger.json, logicmonitor-rest-api-v3-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /santaba/rest
tags:
- name: ConfigSources
paths:
  /setting/configsources/importxml:
    post:
      summary: import config source via xml
      security:
      - LMv1: []
      description: ''
      operationId: importConfigSource
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - ConfigSources
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
    servers:
    - url: /santaba/rest
  /setting/configsources/{id}:
    patch:
      summary: Update config source by ID
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> My Module Toolbox -> PushModules: Manage
        Modules -> My Module Toolbox -> All Installed Modules: Manage
      description: Update the config source details based on the provided ID
      operationId: patchConfigSourceById
      responses:
        '200':
          description: Successfully updated the config source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: reason
        schema:
          type: string
      tags:
      - ConfigSources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigSource'
    get:
      summary: Get config source by ID
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules: View
      description: Retrieve a config source by its ID
      operationId: getConfigSourceById
      responses:
        '200':
          description: Successfully retrieved the config source by ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: format
        schema:
          type: string
      tags:
      - ConfigSources
    delete:
      summary: Delete config source by ID
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> My Module Toolbox -> PushModules: Manage
        Modules -> My Module Toolbox -> All Installed Modules: Manage
      description: Delete a config source based on the provided ID
      operationId: deleteConfigSourceById
      responses:
        '200':
          description: Successfully deleted the config source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - ConfigSources
    put:
      summary: Update config source by ID
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> My Module Toolbox -> PushModules: Manage
        Modules -> My Module Toolbox -> All Installed Modules: Manage
      description: Update the config source details based on the provided ID
      operationId: updateConfigSourceById
      responses:
        '200':
          description: Successfully updated the config source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: reason
        schema:
          type: string
      tags:
      - ConfigSources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigSource'
    servers:
    - url: /santaba/rest
  /setting/configsources/importjson:
    post:
      summary: Import ConfigSource via json
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules ->  All Installed modules: Manage
        Modules -> Access Groups: Manage
      description: Import a ConfigSource using json data
      operationId: importConfigSourceJson
      responses:
        '200':
          description: Successfully imported the ConfigSource via Json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: handleConflict
        schema:
          type: string
      - in: query
        name: fieldsToPreserve
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - ConfigSources
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
    servers:
    - url: /santaba/rest
  /setting/configsources/{id}/updatereasons:
    get:
      summary: Get update history for a configSource
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> My Module Toolbox -> All Installed Modules: View
      description: Retrieve the list of update reasons/history for a specific configSource
      operationId: getUpdateReasonListByConfigSourceId
      responses:
        '200':
          description: Successfully retrieved update history for the configSource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSourceUpdateReasonsPaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - ConfigSources
    servers:
    - url: /santaba/rest
  /setting/configsources:
    post:
      summary: Add a new config source
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> My Module Toolbox -> PushModules: Manage
        Modules -> My Module Toolbox -> All Installed Modules: Manage
      description: Create a new config source
      operationId: addConfigSource
      responses:
        '200':
          description: Successfully added the new config source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - ConfigSources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigSource'
    get:
      summary: Get config source list
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> My Module Toolbox -> All Installed Modules: View
      description: Retrieve a list of config sources
      operationId: getConfigSourceList
      responses:
        '200':
          description: Successfully retrieved the config source list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigsourcePaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: format
        schema:
          type: string
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: filter
        required: false
        schema:
          type: string
      tags:
      - ConfigSources
    servers:
    - url: /santaba/rest
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorMessage:
          description: The error message
          readOnly: true
          type: string
        errorCode:
          format: int32
          description: The error code
          readOnly: true
          type: integer
        errorDetail:
          description: The error detail
          readOnly: true
          type: object
    ConfigsourcePaginationResponse:
      type: object
      properties:
        total:
          format: int32
          readOnly: true
          type: integer
        searchId:
          readOnly: true
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfigSource'
    CollectorAttribute:
      type: object
      required:
      - name
      properties:
        name:
          description: The data collector's name
          type: string
      discriminator:
        propertyName: name
    JSONObject:
      description: The alert external ticket urls
      readOnly: true
      type: object
      properties:
        empty:
          type: boolean
    ConfigSource:
      type: object
      properties:
        accessGroups:
          description: Module's access groups
          type: array
          items:
            $ref: '#/components/schemas/AccessGroup'
        displayName:
          description: The ConfigSource display name
          type: string
        description:
          description: The description for the LMModule
          type: string
        appliesTo:
          description: The Applies To for the LMModule
          type: string
        lineageId:
          description: The lineageId the LMModule belongs to
          readOnly: true
          type: string
        collectMethod:
          description: The method to collect data
          type: string
        originRegistryId:
          description: The Registry ID of the Exchange Integration this module is based from, including this field will set this as the module's import base and mark the ID's version as audited
          type: string
        checksum:
          description: The metadata checksum for the LMModule content
          readOnly: true
          type: string
        id:
          format: int32
          description: The ID of the LMModule
          readOnly: true
          type: integer
        accessGroupIds:
          uniqueItems: true
          description: The Access Groups Id's
          type: array
          items:
            format: int32
            description: The Access Groups Id's
            type: integer
          example: 1, 2, 3
        group:
          description: The group the LMModule is in
          type: string
        collectorAttribute:
          description: Collector attribute
          readOnly: false
          $ref: '#/components/schemas/CollectorAttribute'
        autoDiscoveryConfig:
          description: Auto discovery configuration
          readOnly: false
          $ref: '#/components/schemas/AutoDiscoveryConfiguration'
        adParameters:
          $ref: '#/components/schemas/DataSource'
        configChecks:
          description: The List of ConfigChecks
          type: array
          items:
            $ref: '#/components/schemas/ConfigCheck'
        enableAutoDiscovery:
          description: Enable active discovery if ConfigSource has multiple instances. true|false
          type: boolean
        technology:
          description: The Technical Notes for the LMModule
          type: string
        version:
          format: int64
          description: The ConfigSource version
          type: integer
        tags:
          description: The Tags for the LMModule
          type: string
        auditVersion:
          format: int64
          description: The ConfigSource audit version
          type: integer
        hasMultiInstances:
          description: Whether the ConfigSource has multiple instances. true|false
          type: boolean
        installationMetadata:
          description: The local module's IntegrationMetadata, readable for troubleshooting purposes
          readOnly: true
          $ref: '#/components/schemas/IntegrationMetadata'
        collectInterval:
          format: int32
          description: The ConfigSource data collect interval
          type: integer
        name:
          description: The config source name
          type: string
        timestampFormat:
          description: Timestamp format. ex. yyyy-MM-dd hh:mm:ss
          type: string
        isInUse:
          description: Whether the LM module is currently in use
          readOnly: true
          type: boolean
        fileFormat:
          description: Configuration file format. The values can be arbitrary|unix|java-properties|JSON|XML
          type: string
    ConfigSourceUpdateReasonsPaginationResponse:
      type: object
      properties:
        total:
          format: int32
          readOnly: true
          type: integer
        searchId:
          readOnly: true
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateReason'
    StatusDisplayName:
      description: The status display name list
      type: object
      required:
      - metricValue
      - operator
      - statusDisplayName
      properties:
        statusDisplayName:
          description: The status display name for the metric value
          type: string
        metricValue:
          description: The metric value that the alert must be greater than, less than, or equal to for this status display to be considered
          type: string
        id:
          format: int32
          description: The datapoint id
          readOnly: true
          type: integer
        datapointId:
          format: int32
          description: The datappoint id
          readOnly: true
          type: integer
        operator:
          description: The operator to use for the status display
          type: string
    ConfigCheck:
      description: The List of ConfigChecks
      type: object
      properties:
        ackClearAlert:
          description: Clear alert after ACKED or not
          type: boolean
        originId:
          description: Portable id for origin tracking
          type: string
        name:
          description: The ConfigCheck name
          type: string
        alertLevel:
          format: int32
          description: 'The triggered alert level if config check failure.

            The values can be 1|2|3|4

            where, 1: no alert, 2: warn alert, 3: error alert, 4: critical alert'
          type: integer
        description:
          description: The ConfigCheck description
          type: string
        configSourceId:
          format: int32
          description: The ConfigSource id
          type: integer
        id:
          format: int32
          description: The ConfigCheck id
          type: integer
        type:
          description: The ConfigCheck type. The values can be fetch|ignore|missing|value|groovy
          type: string
        alertEffectiveIval:
          format: int32
          description: Alert effective interval
          type: integer
        script:
          description: The ConfigCheck script
          readOnly: false
          $ref: '#/components/schemas/JSONObject'
        alertTransitionInterval:
          format: int32
          description: The count that the alert must exist for these many poll cycles before it will be triggered
          type: integer
    DataSource:
      type: object
      required:
      - collectInterval
      - collectMethod
      - collectorAttribute
      - name
      properties:
        eriDiscoveryConfig:
          description: Enable ERI Discovery or not
          readOnly: false
          $ref: '#/components/schemas/ScriptERIDiscoveryAttributeV3'
        accessGroups:
          description: Module's access groups
          type: array
          items:
            $ref: '#/components/schemas/AccessGroup'
        displayName:
          description: The data source display name
          type: string
        description:
          description: The description for the LMModule
          type: string
        appliesTo:
          description: The Applies To for the LMModule
          type: string
        lineageId:
          description: The lineageId the LMModule belongs to
          readOnly: true
          type: string
        collectMethod:
          description: The  method to collect data. The values can be snmp|ping|exs|webpage|wmi|cim|datadump|dns|ipmi|jdbb|script|udp|tcp|xen
          type: string
        originRegistryId:
          description: The Registry ID of the Exchange Integration this module is based from, including this field will set this as the module's import base and mark the ID's version as audited
          type: string
        checksum:
          description: The metadata checksum for the LMModule content
          readOnly: true
          type: string
        dataPoints:
          description: The data point list
          type: array
          items:
            $ref: '#/components/schemas/DataPoint'
        id:
          format: int32
          description: The ID of the LMModule
          readOnly: true
          type: integer
        accessGroupIds:
          uniqueItems: true
          description: The Access Groups Id's
          type: array
          items:
            format: int32
            description: The Access Groups Id's
            type: integer
          example: 1, 2, 3
        group:
          description: The group the LMModule is in
          type: string
        collectorAttribute:
          description: "Data collector's attributes to collector data. e.g. a ping data source has a ping collector attribute. \n PingCollectorAttributeV1 has two fields. the ip to ping, the data size send to ping"
          readOnly: false
          $ref: '#/components/schemas/CollectorAttribute'
        autoDiscoveryConfig:
          description: Auto discovery configuration
          readOnly: false
          $ref: '#/components/schemas/AutoDiscoveryConfiguration'
        adParameters:
          $ref: '#/components/schemas/DataSource'
        payloadVersion:
          format: int32
          description: The DataSource payload version for custom metrics
          readOnly: true
          type: integer
        useWildValueAsUUID:
          description: 'Use wild-value as unique identifier in case of multi instance datasource: true|false'
          readOnly: true
          type: boolean
        enableAutoDiscovery:
          description: 'Enable Auto Discovery or not when this data source has multi instance: false|true'
          type: boolean
        technology:
          description: The Technical Notes for the LMModule
          type: string
        version:
          format: int64
          description: The data source version
          readOnly: true
          type: integer
        tags:
          description: The Tags for the LMModule
          type: string
        auditVersion:
          format: int64
          description: The data source audit version
          readOnly: true
          type: integer
        hasMultiInstances:
          description: 'If the DataSource has multi instance: true|false'
          readOnly: true
          type: boolean
        installationMetadata:
          description: The local module's IntegrationMetadata, readable for troubleshooting purposes
          readOnly: true
          $ref: '#/components/schemas/IntegrationMetadata'
        eriDiscoveryInterval:
          format: int32
          description: The DataSource data collect interval
          type: integer
        enableEriDiscovery:
          description: 'Enable ERI Discovery or not: false|true'
          type: boolean
        collectInterval:
          format: int32
          description: The DataSource data collect interval
          type: integer
        name:
          description: The data source name
          type: string
        isInUse:
          description: Whether the LM module is currently in use
          readOnly: true
          type: boolean
    AutoDiscoveryFilter:
      type: object
      required:
      - attribute
      - operation
      properties:
        comment:
          description: The filter comment
          type: string
        attribute:
          description: Attribute to filter
          type: string
        operation:
          description: 'The filter''s operation. The values can be : Equal|NotEqual|GreaterThan|GreaterEqual|LessThan|LessEqual|Contain|NotContain|NotExist|RegexMatch|RegexNotMatch'
          type: string
        value:
          description: The operation value
          type: string
    DataPoint:
      description: The data point list
      type: object
      required:
      - name
      properties:
        alertForNoData:
          format: int32
          description: The triggered alert level if we cannot collect data for this datapoint. The values can be 0-4 (0:unused alert, 1:alert ok, 2:warn alert, 2:error alert, 4:critical alert)
          type: integer
        postProcessorMethod:
          description: The post processor method for the data value. Currently support complex expression and groovy.
          type: string
        postProcessorParam:
          description: The post processor parameter, e.g. dataPoint1*2
          type: string
        maxDigits:
          format: int32
          description: The max digits of the data value
          type: integer
        rawDataFieldName:
          description: The name of the raw data field name used to fetch value, e.g. avgrtt, output
          type: string
        description:
          description: The datapoint description
          type: string
        alertClearTransitionInterval:
          format: int32
          description: The count that the alert must exist for this many poll cycles before the alert will be cleared
          type: integer
        userParam3:
          description: 'The third user parameter will be used to fetch the datapoint value. '
          type: string
        userParam2:
          description: The second user parameter will be used to fetch the datapoint value. e.g. jmx attribute name
          type: string
        type:
          format: int32
          description: The data metric type. The values can be 0-7 (0:unknown, 1:counter, 2:gauge, 3:derive, 5:status, 6:compute, 7:counter32, 8:counter64)
          type: integer
        dataSourceId:
          format: int32
          description: The datasource id
          readOnly: true
          type: integer
        minValue:
          description: The minimum value of the datapoint value range
          type: string
        alertBody:
          description: The customized alert message body define.  Empty string mean we will use the define in default template
          type: string
        originId:
          description: Portable id for origin tracking
          type: string
        userParam1:
          description: The first user parameter will be used to fetch the datapoint value. e.g. snmp oid
          type: string
        alertSubject:
          description: The customized alert message subject define. Empty string mean we will use the define in default template
          type: string
        id:
          format: int32
          description: The datapoint id
          readOnly: true
          type: integer
        alertTransitionInterval:
          format: int32
          description: The count that the alert must exist for this many poll cycles before it will be triggered
          type: integer
        enableAnomalyAlertSuppression:
          description: 'Expression of anomaly detection setting, split by comma

            0 means off,  1 means on, -1 means invalid

            1,0,1 =   warn : ON     error: OFF   critical: ON

            Empty value on this parameter means : 0,0,0'
          type: string
        maxValue:
          description: The max value of the datapoint value range
          type: string
        dataType:
          format: int32
          description: The data value type. The values can be 1-8 (1:boolean, 2:byte, 3:short, 4:int, 5:long, 6:float, 7:double, 8:ulong)
          type: integer
        criticalAdAdvSetting:
          description: Enable anomaly detection advance setting for CRITICAL severity
          type: string
        alertExprNote:
          description: alert expression note
          type: string
        adAdvSettingEnabled:
          description: The AD advance setting enable flag
          type: boolean
        errorAdAdvSetting:
          description: Enable anomaly detection advance setting for ERROR severity
          type: string
        warnAdAdvSetting:
          description: Enable anomaly detection advance setting for WARN severity
          type: string
        name:
          description: The datapoint name
          type: string
        statusDisplayNames:
          description: The status display name list
          type: array
          items:
            $ref: '#/components/schemas/StatusDisplayName'
        alertExpr:
          description: "The alert threshold define for the datapoint. e.g. '> 60 80 90' mean it will: \ntrigger warn alert if value > 60\ntrigger error alert if value > 80\ntrigger critical alert if value > 90"
          type: string
    AccessGroup:
      description: Module's access groups
      type: object
      required:
      - name
      properties:
        createdBy:
          description: User who created access group
          readOnly: true
          type: string
        name:
          description: The name of the access group
          type: string
          example: LinuxGroup
        tenantId:
          description: Tenancy details
          type: string
        description:
          description: Description about access group
          type: string
        id:
          format: int32
          description: The id of the access group
          readOnly: true
          type: integer
        updatedOn:
          format: int64
          description: Time when access group updated
          readOnly: true
          type: integer
        createdOn:
          format: int64
          description: Time when access group created
          readOnly: true
          type: integer
    ScriptERIDiscoveryAttributeV3:
      description: Enable ERI Discovery or not
      type: object
      required:
      - name
      properties:
        winScript:
          description: The Windows script
          type: string
        groovyScript:
          description: The Groovy script
          type: string
        name:
          description: ERI detection name
          type: string
        type:
          description: The script type
          type: string
        linuxCmdline:
          description: The Linux script command line
          type: string
        linuxScript:
          description: The Linux script file
          type: string
        winCmdline:
          description: The Windows script command line
          type: string
    UpdateReason:
      type: object
      properties:
        timeEpoch:
          format: int64
          description: Update date epoch
          readOnly: true
          type: integer
        clientIp:
          description: Client IP from which this update has been made
          readOnly: true
          type: string
        updateReason:
          description: Update reason
          type: string
        timeStr:
          description: Update date in form 'YYYY-MM-DD HH:MM:SS'
          readOnly: true
          type: string
        id:
          format: int32
          description: ID of update reason
          readOnly: true
          type: integer
        userName:
          description: User who made this update
          type: string
    AutoDiscoveryMethod:
      description: Method used to do auto discovery instance
      type: object
      required:
      - name
      properties:
        name:

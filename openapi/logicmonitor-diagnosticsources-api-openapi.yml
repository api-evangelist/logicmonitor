openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: LogicMonitor is a SaaS-based performance monitoring platform that provides full visibility into complex, hybrid infrastructures, offering granular performance monitoring and actionable data and insights.
  title: LogicMonitor REST Diagnostic Sources API
  version: 3.0.0
servers:
- url: /santaba/rest
tags:
- name: DiagnosticSources
paths:
  /setting/diagnosticsources/executemanually:
    post:
      summary: Trigger a diagnostic module for host
      security:
      - LMv1: []
      x-minimum-permissions:
        Host -> Diagnostic Source: NA
      description: Trigger a diagnostic module for host. Set includeOutput=true to wait for completion and return script output.
      operationId: executeDiagnosticsManually
      responses:
        '200':
          description: Trigger a diagnostic module for host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsSourceExecution'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - DiagnosticSources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticsSourceExecution'
  /setting/diagnosticsources:
    post:
      summary: Add diagnostics source
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> All Installed Module: Manage
        Modules -> Access Group: Manage
      description: Adds a new diagnostics source
      operationId: addDiagnosticSource
      responses:
        '200':
          description: Successfully added new diagnostics source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - DiagnosticSources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticsSource'
    get:
      summary: Get diagnostics sources list
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> All Installed Module: View
        Modules -> Access Group: View
      description: Retrieves a list of diagnostics sources
      operationId: getDiagnosticSourcesList
      responses:
        '200':
          description: Successfully retrieved diagnostics sources list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsourcePaginationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - DiagnosticSources
  /setting/diagnosticsources/{id}:
    patch:
      summary: Update a diagnostics source
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> All Installed Module: Manage
        Modules -> Access Group: Manage
      description: Updates a diagnostics source by its ID
      operationId: patchDiagnosticSourceById
      responses:
        '200':
          description: Successfully updated diagnostics source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: reason
        schema:
          type: string
      tags:
      - DiagnosticSources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticsSource'
    get:
      summary: Get diagnostics sources by ID
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> All Installed Module: View
        Modules -> Access Group: View
      description: Retrieves a diagnostics source by its ID
      operationId: getDiagnosticSourcesById
      responses:
        '200':
          description: Successfully retrieved diagnostics source by ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: format
        schema:
          type: string
      tags:
      - DiagnosticSources
    delete:
      summary: Delete a diagnostic source module
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> All Installed Module: Manage
        Modules -> Access Group: Manage
      description: Deletes a diagnostic source module by its ID
      operationId: deleteDiagnosticSourceById
      responses:
        '200':
          description: Successfully deleted diagnostic source module
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - DiagnosticSources
    put:
      summary: Update a diagnostics source
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> All Installed Module: Manage
        Modules -> Access Group: Manage
      description: Updates a diagnostics source by its ID
      operationId: updateDiagnosticSourceById
      responses:
        '200':
          description: Successfully updated diagnostics source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: reason
        schema:
          type: string
      tags:
      - DiagnosticSources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticsSource'
  /setting/diagnosticsources/importjson:
    post:
      summary: Import DiagnosticSource via json
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> Default Access Group: Manage
        Modules ->  All Installed modules: Manage
      description: Import a DiagnosticSource using json data
      operationId: importDiagnosticSourceJson
      responses:
        '200':
          description: Successfully imported the DiagnosticSource via Json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestDiagnosticSourceV4'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: handleConflict
        schema:
          type: string
      - in: query
        name: fieldsToPreserve
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - DiagnosticSources
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: LogicModule JSON file
                  format: binary
              required:
              - file
components:
  schemas:
    DiagnosticsSourceExecution:
      description: Represents a diagnostic execution for a host in the LogicMonitor system.
      type: object
      required:
      - diagnosticId
      - executionStatus
      - hostDiagnosticSourceId
      - hostId
      - triggerType
      properties:
        output:
          description: Script output when includeOutput is true and execution has completed
          readOnly: true
          type: string
        executionId:
          description: 'execution Id '
          readOnly: true
          type: string
        diagnosticId:
          format: int32
          description: The diagnostic module id
          type: integer
          example: 12345
        executionStatus:
          description: The diagnostic module id
          readOnly: true
          type: string
          example: '60'
        hostId:
          format: int32
          description: The host id
          type: integer
          example: 12345
        alertId:
          description: The alert id
          type: string
          example: alert12345
        triggerType:
          description: type of trigger
          readOnly: true
          type: string
          example: scheduled
        hostDiagnosticSourceId:
          format: int32
          description: The diagnostic module id
          type: integer
          example: 12345
        includeOutput:
          description: When true, the API waits for execution to finish and returns script output in the response
          type: boolean
          example: false
    LogicModuleAssociationCounts:
      type: object
      properties:
        inUse:
          type: boolean
    RestScriptV4:
      type: object
      properties:
        powershellScript:
          type: string
        linuxScriptFilename:
          type: string
        windowsUploadScriptContent:
          readOnly: true
          type: string
        linuxUploadScriptContent:
          readOnly: true
          type: string
        groovyScript:
          type: string
        windowsScriptFilename:
          type: string
        linuxArguments:
          type: string
        windowsArguments:
          type: string
        windowsUploadScriptBinaryContentChecksum:
          readOnly: true
          type: string
        type:
          type: string
          enum:
          - INVALID
          - GROOVY
          - POWERSHELL
          - UPLOADED_FILE
          - PROPERTY
        linuxUploadScriptBinaryContentChecksum:
          readOnly: true
          type: string
    ScriptERIDiscoveryAttributeV3:
      description: Enable ERI Discovery or not
      type: object
      required:
      - name
      properties:
        winScript:
          description: The Windows script
          type: string
        groovyScript:
          description: The Groovy script
          type: string
        name:
          description: ERI detection name
          type: string
        type:
          description: The script type
          type: string
        linuxCmdline:
          description: The Linux script command line
          type: string
        linuxScript:
          description: The Linux script file
          type: string
        winCmdline:
          description: The Windows script command line
          type: string
    DiagnosticsSource:
      type: object
      properties:
        accessGroups:
          description: Access group Details in response
          type: array
          items:
            $ref: '#/components/schemas/AccessGroup'
        groovyScript:
          description: groovy script
          type: string
        dataType:
          format: int32
          description: "The data type of diagnostics source, default is 0. The values can be\n\n0: diagnostics source\n\n1: raw ERI\n\n "
          readOnly: true
          type: integer
        description:
          description: The description for the LMModule
          type: string
        appliesTo:
          description: The Applies To for the LMModule
          type: string
        technology:
          description: The Technical Notes for the LMModule
          type: string
        source:
          description: The diagnostics source
          readOnly: true
          type: string
        lineageId:
          description: The lineageId the LMModule belongs to
          readOnly: true
          type: string
        tags:
          description: The Tags for the LMModule
          type: string
        installationMetadata:
          description: The local module's IntegrationMetadata, readable for troubleshooting purposes
          readOnly: true
          $ref: '#/components/schemas/IntegrationMetadata'
        originRegistryId:
          description: The Registry ID of the Exchange Integration this module is based from, including this field will set this as the module's import base and mark the ID's version as audited
          type: string
        scriptType:
          description: 'script type: groovy | powershell'
          type: string
        checksum:
          description: The metadata checksum for the LMModule content
          readOnly: true
          type: string
        name:
          description: The diagnostics source name
          readOnly: true
          type: string
        id:
          format: int32
          description: The ID of the LMModule
          readOnly: true
          type: integer
        accessGroupIds:
          uniqueItems: true
          description: The Access Groups Id's
          type: array
          items:
            format: int32
            description: The Access Groups Id's
            type: integer
          example: 1, 2, 3
        isInUse:
          description: Whether the LM module is currently in use
          readOnly: true
          type: boolean
        installationStatuses:
          description: The diagnostics Installation status
          readOnly: true
          type: array
          items:
            description: The diagnostics Installation status
            readOnly: true
            type: string
            enum:
            - NEW
            - UPGRADED
            - AUDITED
            - OUTDATED
            - INSTALLED
            - CUSTOMIZED
            - CONFLICT
            - PARTIALLY_INSTALLED
            - IS_INSTALLED
            - IS_CUSTOMIZED
            - CAN_INSTALL
            - CAN_UPGRADE
            - CAN_SKIP
            - CAN_DOWNGRADE
        group:
          description: The group the LMModule is in
          type: string
    AutoDiscoveryConfiguration:
      description: Auto discovery configuration
      type: object
      required:
      - method
      properties:
        persistentInstance:
          description: Persist discovered instance
          type: boolean
        scheduleInterval:
          format: int32
          description: Auto discovery schedule interval in minutes. 0 means host or data source changed. The values can be 0|15|60|1440
          type: integer
        deleteInactiveInstance:
          description: Delete inactive instance
          type: boolean
        method:
          $ref: '#/components/schemas/AutoDiscoveryMethod'
        instanceAutoGroupMethod:
          description: Auto group method. The values can be none|netscaler|netscalerservicegroup|regex|esx|ilp
          type: string
        instanceAutoGroupMethodParams:
          description: Auto group method's parameters
          type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AutoDiscoveryFilter'
        disableInstance:
          description: Disable discovered instance
          type: boolean
        showDeletedInstanceDays:
          format: int32
          description: show deleted instance days
          type: integer

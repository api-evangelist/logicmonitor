openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: LogicMonitor is a SaaS-based performance monitoring platform that provides full visibility into complex, hybrid infrastructures, offering granular performance monitoring and actionable data and insights.
  title: LogicMonitor REST Logic Modules API
  version: 3.0.0
servers:
- url: /santaba/rest
tags:
- name: LogicModules
paths:
  /setting/logicmodules/metadata:
    get:
      summary: get metadata
      security:
      - LMv1: []
      x-minimum-permissions:
        Modules -> All Installed modules: View
        Modules -> Access Groups: View
      operationId: getV4Metadata
      responses:
        '200':
          description: Successfully retrieved metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - LogicModules
components:
  schemas:
    Response:
      type: object
      properties:
        data:
          type: object
        errmsg:
          type: string
        ok:
          $ref: '#/components/schemas/Response'
        status:
          format: int32
          type: integer
    ErrorResponse:
      type: object
      properties:
        errorMessage:
          description: The error message
          readOnly: true
          type: string
        errorCode:
          format: int32
          description: The error code
          readOnly: true
          type: integer
        errorDetail:
          description: The error detail
          readOnly: true
          type: object
  securitySchemes:
    LMv1:
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: LogicMonitor Support Docs
  url: https://www.logicmonitor.com/support/rest-api-developers-guide/

openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: LogicMonitor is a SaaS-based performance monitoring platform that provides full visibility into complex, hybrid infrastructures, offering granular performance monitoring and actionable data and insights.
  title: LogicMonitor REST Userdata API
  version: 3.0.0
servers:
- url: /santaba/rest
tags:
- name: User Data
paths:
  /setting/userdata/{id}:
    patch:
      summary: Update default dashboard
      security:
      - LMv1: []
      x-minimum-permissions:
        Note: No RBAC permission needed
      description: Update the default dashboard settings for a user or group
      operationId: patchDefaultDashboard
      responses:
        '200':
          description: Successfully updated the default dashboard
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      tags:
      - User Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestUserCustomizedDataV3'
    put:
      summary: Update default dashboard
      security:
      - LMv1: []
      x-minimum-permissions:
        Note: No RBAC permission needed
      description: Update the default dashboard settings for a user or group
      operationId: updateDefaultDashboard
      responses:
        '200':
          description: Successfully updated the default dashboard
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      tags:
      - User Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestUserCustomizedDataV3'
components:
  schemas:
    RestUserCustomizedDataV3:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
    ErrorResponse:
      type: object
      properties:
        errorMessage:
          description: The error message
          readOnly: true
          type: string
        errorCode:
          format: int32
          description: The error code
          readOnly: true
          type: integer
        errorDetail:
          description: The error detail
          readOnly: true
          type: object
  securitySchemes:
    LMv1:
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: LogicMonitor Support Docs
  url: https://www.logicmonitor.com/support/rest-api-developers-guide/

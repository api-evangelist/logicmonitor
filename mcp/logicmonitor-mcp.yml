specification: API Commons MCP
specificationVersion: '0.1'
provider: LogicMonitor
providerId: logicmonitor
generated: '2026-08-29'
method: searched
source: >-
  https://github.com/logicmonitor/logicmonitor-api-mcp (README + src/tools/registry.ts, read 2026-08-29) ;
  https://www.npmjs.com/package/logicmonitor-api-mcp ; announcement thread at
  https://community.logicmonitor.com/forum/product-discussions-68/topic/announcing-the-logicmonitor-mcp-server-bringing-real-time-observability-to-ai-agents-2397/
name: LogicMonitor MCP Server
status: published
description: >-
  An MCP server over the LogicMonitor REST API v3, published to npm as logicmonitor-api-mcp and hosted in
  the logicmonitor GitHub organization. It is NOT a vendor-hosted remote endpoint: there is no URL an agent
  can POST to today. The README states the project "is an open-source community project and is not officially
  supported by LogicMonitor", so this is recorded as a vendor-org community server rather than a first-party
  product. LogicMonitor separately markets an "MCP" governance capability for Edwin AI on
  https://www.logicmonitor.com/platform/edwin-ai-mcp-model-context-protocol and documents it at
  https://www.logicmonitor.com/support/mcp-server, but that support page renders its body client-side and
  returned no machine-readable endpoint, install command or tool list to this probe.
deployment:
  mode: local-stdio
  endpoint: null
  install: npx -y logicmonitor-api-mcp --stdio
  package: https://www.npmjs.com/package/logicmonitor-api-mcp
  auth: api-key
  verified: searched
  note: >-
    The server also ships an HTTP transport, but it is SELF-HOSTED — the README's example client config
    points at "http://your-server:3000/mcp", a host the operator stands up. LogicMonitor publishes no
    hosted MCP URL, so mode stays local-stdio. LogicMonitor credentials are supplied per request via
    X-LM-Account and X-LM-Bearer-Token headers, or via LM_ACCOUNT / LM_BEARER_TOKEN environment variables;
    optional MCP-client authentication is a static bearer token (AUTH_MODE=bearer). There is no OAuth flow.
transports:
  - stdio
  - streamable-http (self-hosted only)
backing_api:
  name: LogicMonitor REST API v3
  openapi: openapi/logicmonitor-rest-api-v3-swagger.json
  base_url: https://{account}.logicmonitor.com/santaba/rest
tools:

  - name: lm_session
    title: LogicMonitor Session Management
    operations: []
    note: >-
      Server-side session context — recent results, stored variables and request history — so follow-up
      calls can reference prior output. Has no backing REST operation.
tool_count: 13
prompts:
  note: >-
    The repository ships guided workflow prompts in src/tools/prompts.ts (for example an export-device-metrics
    flow). Names were not enumerated in this pass; the live schemas require running the server.
schemas_gated: true
schemas_note: >-
  tools/list was not called live because the server is local-stdio only and requires a LogicMonitor tenant
  bearer token. Tool names, titles and operation verbs above are read verbatim from src/tools/registry.ts;
  the full inputSchema for each tool lives in the Zod schemas under src/resources/*/. Parameter-level detail
  in the crosswalk is therefore inherited from the backing REST operations, not from a live introspection.

apis:
  - aid: logicmonitor:logicmonitor
    name: LogicMonitor REST API v3
    description: >-
      The LogicMonitor platform API. Swagger 2.0, 220 paths, 403 operations and 743 definitions covering
      devices and device groups, collectors and collector groups, alerts, alert rules and escalation
      chains, scheduled downtime, dashboards and widgets, websites and website groups, datasources and
      instances, time-series data, log pipelines, reports, netscans, cost-optimization recommendations,
      users, roles, API tokens and audit logs. Served per tenant at
      https://{account}.logicmonitor.com/santaba/rest, versioned by an X-Version header or ?v= query
      parameter, and authenticated with a Bearer token or an LMv1 HMAC-SHA256 signature. Every operation
      declares x-minimum-permissions, the minimum LogicMonitor role permission it requires.
    humanURL: https://www.logicmonitor.com/support/rest-api-developers-guide/
    baseURL: https://{account}.logicmonitor.com/santaba/rest

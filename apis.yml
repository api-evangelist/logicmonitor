aid: logicmonitor
name: LogicMonitor
description: >-
  LogicMonitor is an AI-powered hybrid observability and AIOps platform that monitors infrastructure,
  cloud and multi-cloud estates, containers, networks, databases, storage, logs, traces, websites and
  internet performance from a single SaaS portal, with an agentic AIOps layer (Edwin AI) for event
  correlation and governed remediation. Everything the portal does is addressable through the LogicMonitor
  REST API v3 — a published Swagger 2.0 contract of 220 paths and 403 operations covering devices, device
  groups, collectors, alerts, scheduled downtime, dashboards, websites, reports, log pipelines, cost
  optimization and user administration, with per-operation x-minimum-permissions metadata. First-party
  Python, Go, PowerShell and Terraform tooling wraps it, and telemetry can be pushed in over OpenTelemetry
  OTLP, OpenMetrics/Prometheus exposition, and the Push Metrics and LM Logs ingestion APIs.

  name: LogicMonitor MCP Server
  description: >-
    A Model Context Protocol server over the LogicMonitor REST API v3, published to npm as logicmonitor-api-mcp
    and hosted in the LogicMonitor GitHub organization, exposing 13 resource-shaped tools for devices,
    device groups, alerts, websites, collectors, users, dashboards, device data, scheduled downtime, ops
    notes and session state. Local stdio only — there is no vendor-hosted endpoint — and its README states
    it is a community project not officially supported by LogicMonitor.

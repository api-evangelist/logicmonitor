specification: API Commons Packages
specificationVersion: '0.1'
provider: LogicMonitor
providerId: logicmonitor
generated: '2026-08-29'
method: searched
source: >-
  https://www.logicmonitor.com/support/logicmonitor-v3-sdk ; https://github.com/logicmonitor ;
  registry metadata read live from registry.npmjs.org, pypi.org, proxy.golang.org, rubygems.org,
  search.maven.org, www.powershellgallery.com and registry.terraform.io on 2026-08-29
description: >-
  First-party LogicMonitor client libraries, ingestion SDKs, log shippers and infrastructure-as-code
  providers. LogicMonitor's documented SDK story for REST API v3 is Python and Go, both auto-generated
  from the v3 Swagger with Swagger Codegen; the remaining entries are first-party data-ingestion and
  log-forwarding libraries published from the logicmonitor GitHub organization.
packages:
  - name: logicmonitor-sdk
    registry: pypi
    url: https://pypi.org/project/logicmonitor-sdk/
    repository: https://github.com/logicmonitor/lm-sdk-python
    language: python
    official: true
    version: 3.0.256
    published: '2026-07-30'
    covers: REST API v3
    note: >-
      Documented as the LogicMonitor v3 Python SDK; install with `pip install logicmonitor-sdk`.
      Auto-generated from the REST API v3 Swagger via Swagger Codegen. Supports LMv1 and Bearer auth.
  - name: github.com/logicmonitor/lm-sdk-go
    registry: go
    url: https://pkg.go.dev/github.com/logicmonitor/lm-sdk-go
    repository: https://github.com/logicmonitor/lm-sdk-go
    language: go
    official: true
    version: v1.3.0-rc01
    published: '2023-12-07'
    covers: REST API v3
    note: >-
      Documented as the LogicMonitor v3 Go SDK. Latest module version published to proxy.golang.org is a
      release candidate dated 2023-12-07, while the REST API v3 Swagger it wraps was last changed in the
      v242 platform release (changelog updated 2026-07-21) — the Go SDK trails the contract it wraps.
  - name: Logic.Monitor
    registry: powershell-gallery
    url: https://www.powershellgallery.com/packages/Logic.Monitor
    repository: https://github.com/logicmonitor/lm-powershell-module
    language: powershell
    official: true
    version: 7.9.6
    published: '2026-07-27'
    covers: REST API v3
    note: PowerShell module for the LogicMonitor REST API; also the provider's de facto command-line surface.
  - name: logicmonitor/logicmonitor
    registry: terraform-registry
    url: https://registry.terraform.io/providers/logicmonitor/logicmonitor/latest
    repository: https://github.com/logicmonitor/terraform-provider-logicmonitor
    language: hcl
    official: true
    version: 2.1.4
    published: '2026-08-21'
    covers: REST API v3 (infrastructure as code)
    note: >-
      Published Terraform provider. proxy.golang.org still reports v1.3.4 (2021-03-16) for the module path
      because the provider is distributed through the Terraform Registry, not as an importable Go module.
  - name: logicmonitor-api-mcp
    registry: npm
    url: https://www.npmjs.com/package/logicmonitor-api-mcp
    repository: https://github.com/logicmonitor/logicmonitor-api-mcp
    language: typescript
    official: false
    version: 2.1.2
    published: '2026-05-04'
    covers: MCP server over REST API v3
    note: >-
      Hosted in the logicmonitor GitHub organization but the README states plainly it is "an open-source
      community project and is not officially supported by LogicMonitor" — recorded official:false on the
      provider's own words.
  - name: logicmonitor-data-sdk
    registry: pypi
    url: https://pypi.org/project/logicmonitor-data-sdk/

absent:
  - registry: npm
    checked:
      - lm-data-sdk-js
      - '@logicmonitor/data-sdk'
    result: 404
    note: >-
      The logicmonitor/lm-data-sdk-js repository exists on GitHub (last pushed 2023-09-25) but no matching
      package is published to npm under either name; there is no first-party JavaScript client on a registry.
  - registry: nuget
    checked:
      - LogicMonitor.Api
      - LogicMonitor.PowerShell
      - Serilog.Sinks.LogicMonitor
    result: present-but-third-party
    note: >-
      Every LogicMonitor package on NuGet is authored by third parties (Panoramic Data Limited, David Bond,
      Ian Kluhsman), not by LogicMonitor. The logicmonitor/lm-data-sdk-dotnet repository publishes no
      first-party NuGet coordinate. Recorded as an honest absence rather than credited to the provider.

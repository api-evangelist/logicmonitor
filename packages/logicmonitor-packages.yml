    language: python
    official: true
    version: 0.0.9b3
    published: '2025-08-28'
    covers: Push Metrics / log ingestion API
    note: Pre-release versioning (0.0.9b3) after five years of publication.
  - name: github.com/logicmonitor/lm-data-sdk-go
    registry: go
    url: https://pkg.go.dev/github.com/logicmonitor/lm-data-sdk-go
    repository: https://github.com/logicmonitor/lm-data-sdk-go
    language: go
    official: true
    version: v1.4.0
    published: '2026-08-28'
    covers: Metric and log ingestion
    note: Most recently released first-party LogicMonitor package found in this pass.
  - name: com.logicmonitor:lm-logs-sdk-java
    registry: maven
    url: https://central.sonatype.com/artifact/com.logicmonitor/lm-logs-sdk-java
    repository: https://github.com/logicmonitor/lm-logs-sdk-java
    language: java
    official: true
    version: '1.2'
    published: '2021-03-03'
    covers: Log ingestion
    note: >-
      Only artifact published under the com.logicmonitor Maven groupId; last release 2021-03-03. The
      lm-data-sdk-java repository is still active on GitHub but publishes no Maven Central coordinate
      under that groupId.
  - name: fluent-plugin-lm-logs
    registry: rubygems
    url: https://rubygems.org/gems/fluent-plugin-lm-logs

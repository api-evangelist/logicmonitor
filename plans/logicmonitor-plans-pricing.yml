trial:
  available: true
  length_days: 14
  scope: full LogicMonitor platform
  url: https://www.logicmonitor.com/signup
  note: Signup page returns HTTP 200; the trial is the only self-serve entry point found.
api_pricing:
  metered: false
  note: >-
    The REST API is not separately priced or metered. It is included with the platform subscription and
    governed by the published rate limits in rate-limits/logicmonitor-rate-limits.yml, not by a paid quota.
    Usage is reported inside the product (Usage Reporting by contributor, resource, logs, synthetics),
    which implies a resource/unit-based commercial model, but LogicMonitor publishes no unit price.

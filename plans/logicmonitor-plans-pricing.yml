description: >-
  LogicMonitor publishes NO machine-readable or human-readable price for any tier. The pricing page at
  https://www.logicmonitor.com/pricing returned HTTP 200 but renders its plan comparison client-side; the
  server-delivered document contains no tier name, no currency figure and no quota. Every documented path
  to a number is a form — "Try it free" (a 14-day trial of the full platform) or a demo/quote request.
  This artifact replaces the 2026-05-04 bulk-sweep scaffold, which invented a Free / Pro / Enterprise
  ladder with fabricated request quotas that LogicMonitor has never published.
plan_count: 0

shared_rules:
  - Send X-Version: 3 (or ?v=3) on every request; the default version is otherwise implicit.
  - The host is the customer's own portal subdomain — https://{account}.logicmonitor.com/santaba/rest.
  - LMv1 signatures exclude query parameters from the signed resource path and expire after 30 minutes.
  - There is no idempotency key. Look before you create; a duplicate returns 1409.
  - On 429/1429 sleep X-Rate-Limit-Window seconds. No Retry-After header is sent.
  - DELETE on a resource or group is restorable for seven days through the UI only — not through this API.

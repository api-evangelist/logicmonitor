specification: API Commons OAuth Scopes
specificationVersion: '0.1'
provider: LogicMonitor
providerId: logicmonitor
generated: '2026-08-29'
method: derived
source: Derived from x-minimum-permissions on all 403 operations in openapi/logicmonitor-rest-api-v3-swagger.json
docs: https://www.logicmonitor.com/support/determining-api-v3-swagger-permissions
model: rbac-role-permissions
oauth2: false
description: 'LogicMonitor has NO OAuth scopes. Authorization is role-based: an LMv1 or Bearer token inherits the
  permissions of the LogicMonitor role attached to the user that owns it. What the v3 Swagger DOES publish, uniquely
  among LogicMonitor artifacts, is x-minimum-permissions on every one of its 403 operations — a machine-readable
  statement of the minimum role permission each call needs. That is the nearest equivalent to a scope catalog this
  API has, and it is genuinely least-privilege readable: an agent can compute the minimum role for a workflow before
  it runs. This file enumerates the distinct permission/level pairs the contract declares. Note the vocabulary is
  not normalised — LogicMonitor ships several spellings of the same module permission (for example "Modules -> All
  Installed modules" and "Modules -> All Installed Module"), so string equality across operations is unsafe.'
levels:
- Acknowledge
- Checked
- Manage
- Manage (all)
- NA
- No RBAC permission needed
- No RBAC permissions needed
- Unchecked
- View
- View (all)
- View permissions for all pages
- View permissions on Resources page
- View permissions on Services and Resources page
- View permissions on Services and Website page
note_levels: Levels are taken verbatim from the contract and are NOT a clean enum. Alongside View, Manage and Acknowledge
  the spec ships free-text values such as 'No RBAC permission needed', 'View permissions on Services and Resources
  page', 'Checked'/'Unchecked' and 'NA'. Recorded as published rather than normalised.
